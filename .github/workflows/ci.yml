name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://crm_app:crm_app@localhost:5432/crm_test
      DATABASE_URL_MIGRATE: postgres://crm:crm@localhost:5432/crm_test
      APP_DB_PASSWORD: crm_app
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrate test database
        run: pnpm db:migrate
      - name: Check migrations are in sync with schema
        run: pnpm drizzle-kit check
      - name: Unit + integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
